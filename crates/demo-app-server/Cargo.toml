[package]
name = "demo-app-server"
description = "HTTP service: router, state and the axum binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Forwards the simulated platform to core (harness/dst only).
sim = ["demo-app-core/sim"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "matched-path", "query", "tokio"] }
demo-app-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "request-id", "timeout", "trace", "util"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
http-body-util.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
