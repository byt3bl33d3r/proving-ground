# Disposable per-worktree telemetry stack: VictoriaMetrics, VictoriaLogs, VictoriaTraces.
# Started by `just up`, removed by `just down`. The compose project name (COMPOSE_PROJECT_NAME)
# and the ports (VM_PORT, VL_PORT, VT_PORT) come from the justfile's harness variables.
#
# No healthchecks: the images have no shell (VictoriaMetrics uses the -scratch variant), so
# `just up` polls each service's /health from the host instead. Data lives on tmpfs.
services:
  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.153.0-scratch
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1d
      - -opentelemetry.usePrometheusNaming   # http.server.request.duration -> http_server_request_duration_seconds_*
      - -search.latencyOffset=1s             # default 30s hides fresh samples from queries
    ports:
      - "127.0.0.1:${VM_PORT:?VM_PORT not set; run via just up}:8428"
    tmpfs:
      - /storage

  victoria-logs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1d
    ports:
      - "127.0.0.1:${VL_PORT:?VL_PORT not set; run via just up}:9428"
    tmpfs:
      - /storage

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.12.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=1d
      - -search.latencyOffset=1s             # default 30s hides fresh spans from search
      - -insert.indexFlushInterval=1s        # default 20s delays trace lookup by id
    ports:
      - "127.0.0.1:${VT_PORT:?VT_PORT not set; run via just up}:10428"
    tmpfs:
      - /storage
