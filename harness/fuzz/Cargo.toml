# Fuzz targets (cargo-fuzz). A separate workspace; every `cargo fuzz` call passes
# `--fuzz-dir harness/fuzz` (see the `fuzz` recipes in the justfile). Versions shared with the
# main workspace must match [workspace.dependencies] (checked by harness/checks/tests/arch.rs).
[package]
name = "fuzz"
version = "0.0.0"
description = "Fuzz targets for the core crate"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.5.0", features = ["derive"] }
demo-app-core = { path = "../../crates/demo-app-core" }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["rt"] }

[workspace]

[[bin]]
name = "parse_item_id"
path = "fuzz_targets/parse_item_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_create_item"
path = "fuzz_targets/decode_create_item.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_core"
path = "fuzz_targets/differential_core.rs"
test = false
doc = false
bench = false
