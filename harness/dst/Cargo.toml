# Deterministic simulation testing (turmoil + mad-turmoil + buggify). A separate workspace so
# the main workspace never builds core/server with the `sim` feature. Versions shared with the
# main workspace must match [workspace.dependencies] (checked by harness/checks/tests/arch.rs).
# mad-turmoil replaces the process clock: never add it to a main-workspace crate.
[package]
name = "dst"
version = "0.0.0"
description = "Deterministic simulation tests for the items service"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12.1"
demo-app-core = { path = "../../crates/demo-app-core", features = ["sim"] }
demo-app-server = { path = "../../crates/demo-app-server", features = ["sim"] }
fastrand = "2.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
mad-turmoil = "0.2.1"
rand = "0.10.3"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
turmoil = "0.7.2"

[workspace]
