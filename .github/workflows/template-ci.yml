# The template's own test (template repository only; removed on generation): generate a project,
# check that every license choice renders, run the acceptance steps on one license
# (`just template-ci`), and validate the docs/ bundle (`just knowledge`). The other workflows are
# for generated projects and are disabled on this repository (see TEMPLATE_README.md).
name: template-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # Generate before the cache step: rust-cache reads `cargo metadata` from each workspace, and
      # the template's own Cargo.toml is unrendered Liquid.
      - run: echo "TEMPLATE_CI_DIR=$RUNNER_TEMP/template-ci" >> "$GITHUB_ENV"
      - run: just template-generate
      - run: just template-licenses
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            ${{ env.TEMPLATE_CI_DIR }}/demo-app -> target
            ${{ env.TEMPLATE_CI_DIR }}/demo-app/harness/dst -> target
            ${{ env.TEMPLATE_CI_DIR }}/demo-app/harness/fuzz -> target
            ${{ env.TEMPLATE_CI_DIR }}/demo-app/harness/lints -> target
          cache-directories: ~/.dylint_drivers
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just ci-deps
      - run: just template-ci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-ci
          path: target/harness/
          if-no-files-found: ignore

  knowledge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: just knowledge
      - if: github.event_name == 'pull_request'
        run: just knowledge-pr ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.number }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-knowledge
          path: target/harness/
          if-no-files-found: ignore
