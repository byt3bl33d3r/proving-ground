# Tool versions for every developer machine and CI runner: `mise install` installs all of them.
# The Rust toolchain itself is pinned in rust-toolchain.toml (stable) and NIGHTLY below.
# Protected: COV_MIN_REGIONS (ask before lowering; `just cov-ratchet` raises it).

[tools]
# Task runner, git hooks, JSON
just = "1.58.0"
hk = "2.5.0"
pkl = "0.32.1"
jq = "1.8.2"

# Formatters, linters and scanners used by hk steps
taplo = "0.10.0"
typos = "1.51.1"
gitleaks = "8.30.1"
actionlint = "1.7.12"

# Local CI
act = "0.2.89"
"github:bahdotsh/wrkflw" = "0.8.0"

# Rust tooling with prebuilt binaries
"aqua:cargo-bins/cargo-binstall" = "1.25.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"aqua:taiki-e/cargo-llvm-cov" = "0.9.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:mitsuhiko/insta" = "1.49.0"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:cargo-generate/cargo-generate" = "0.25.0"
sccache = "0.18.0"

# Rust tooling through cargo (binstall when a prebuilt exists, otherwise compiled once)
"cargo:cargo-dylint" = "6.1.0"
"cargo:dylint-link" = "6.1.0"
"cargo:cargo-show-asm" = "0.2.63"
"cargo:cargo-fuzz" = "0.13.2"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-public-api" = "0.52.0"
"cargo:cargo-llvm-lines" = "0.4.48"
"cargo:cargo-remark" = "0.1.2"
"cargo:cargo-outdated" = "0.19.0"
"cargo:kani-verifier" = "0.68.0"
"cargo:gungraun-runner" = "0.20.0" # must equal the gungraun library version exactly

# Agent tooling: Victoria MCP servers (started by `just mcp`) and the okf project-memory CLI
"github:VictoriaMetrics/mcp-victoriametrics" = "1.20.2"
"github:VictoriaMetrics/mcp-victorialogs" = "1.9.0"
"github:VictoriaMetrics/mcp-victoriatraces" = "1.5.0"
"github:okf-memory/okf-agent-memory" = "0.6.0"

[env]
PROJECT_NAME = "demo-app"
OTEL_SERVICE_NAME = "demo-app"
# The only nightly analysis recipes use (`cargo +$NIGHTLY ...`); nothing else uses nightly.
NIGHTLY = "nightly-2026-10-07"
# Coverage gate (region %). Protected: never lower it; `just cov-ratchet` raises it.
COV_MIN_REGIONS = "0"
# Share compiled dependencies between worktrees (each worktree keeps its own target/).
RUSTC_WRAPPER = "sccache"
